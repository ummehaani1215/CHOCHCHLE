<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Little Surprise</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="small-heading">A LITTLE SURPRISE ✨</div>

        <h1>For the two of you ♡</h1>

        <p class="intro">
            Enter your names to continue
        </p>

        <div class="input-group">

            <input
                type="text"
                id="name1"
                placeholder="Her name"
                autocomplete="off"
            >

            <input
                type="text"
                id="name2"
                placeholder="His name"
                autocomplete="off"
            >

        </div>

        <button onclick="openSurprise()">
            Continue →
        </button>

        <p id="errorMessage"></p>

    </div>

    <script src="script.js"></script>

</body>

</html>
