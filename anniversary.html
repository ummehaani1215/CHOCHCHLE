<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Anniversary</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <div class="small-heading">
            ♡ ONE YEAR ♡
        </div>

        <h1>
            Happy 1st Wedding Anniversary
        </h1>

        <h2 id="coupleNames"></h2>

        <p>
            Congratulations on your first year together.
        </p>

        <p>
            Here's to all the memories you've made,
            and all the beautiful ones are yet to come.
        </p>

        <p class="ending">
             ♡ With love, always ♡
        </p>

        <p class="ending">
             P.S. Already waiting to be a Masi :)
        </p>

        <img src="couple.JPG" alt="A beautiful memory" class="couple-photo">

        <p class="credits">
              ~ Anwar & Family ~
        </p>

    </div>

    <script>

        const name1 = localStorage.getItem("name1");
        const name2 = localStorage.getItem("name2");

        document.getElementById("coupleNames").innerText =
            name1 + " & " + name2;

    </script>

</body>

</html>
